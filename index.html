<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Summarizer</title>
<script>try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&family=Geist+Mono:wght@500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --paper: light-dark(#f7f4ee, #141311); --surface: light-dark(#fffdf9, #1c1a17);
    --ink: light-dark(#1d1a16, #ece7de); --ink-2: light-dark(#5b554c, #ada597); --ink-3: light-dark(#8a8378, #7f786d);
    --rule: light-dark(#e4ddd1, #2e2a25); --accent: light-dark(#c4321f, #ff6a52); --accent-ink: light-dark(#fff, #1a0b08);
    --chip-bg: light-dark(#f3e4dc, #33201b); --chip-ink: light-dark(#9b2617, #ff9a87); --band: light-dark(#efe9df, #1f1c19);
    --shadow: 0 1px 2px light-dark(rgb(58 42 26 / .06), rgb(0 0 0 / .3)), 0 8px 24px -8px light-dark(rgb(58 42 26 / .18), rgb(0 0 0 / .6));
    --serif: "Newsreader", Georgia, serif; --sans: "Schibsted Grotesk", -apple-system, system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, monospace;
    --ease: cubic-bezier(.16, 1, .3, 1);
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  * { box-sizing: border-box; }
  html { scrollbar-color: var(--rule) transparent; scroll-padding-top: calc(var(--bar-h, 0px) + 28px); }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.55 var(--sans);
         -webkit-font-smoothing: antialiased; caret-color: var(--accent); }
  ::selection { background: var(--chip-bg); color: var(--chip-ink); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  a { color: inherit; text-underline-offset: .2em; text-decoration-thickness: 1px; }
  svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75;
          stroke-linecap: round; stroke-linejoin: round; }
  [hidden] { display: none !important; }

  .theme { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); }
  .theme button { display: grid; place-items: center; width: 30px; height: 28px; border: 0; border-radius: 7px;
                  background: none; color: var(--ink-3); cursor: pointer; transition: background .15s, color .15s; }
  .theme button:hover { color: var(--ink); }
  .theme button[aria-checked="true"] { background: var(--band); color: var(--ink); }
  body.empty .theme { position: absolute; top: 20px; right: 16px; }

  /* ---------- top bar / empty state ---------- */
  body:not(.empty) .top { position: sticky; top: 0; z-index: 10; background: var(--paper); border-bottom: 1px solid var(--rule); }
  body:not(.empty) .bar { padding-block: 14px; }
  .bar { max-width: 1180px; margin: 0 auto; padding: 20px 16px; display: flex; align-items: center; gap: 20px; }
  .brand { display: flex; align-items: center; gap: 10px; white-space: nowrap;
           font: 500 1.3rem/1 var(--serif); letter-spacing: -.015em; }
  .brand em { font-weight: 400; color: var(--accent); }
  .brand img { width: 28px; height: 28px; }
  form { flex: 1; display: flex; gap: 8px; max-width: 640px; margin-left: auto; }
  input { flex: 1; min-width: 0; padding: 10px 14px; font: inherit; color: inherit; background: var(--surface);
          border: 1px solid var(--rule); border-radius: 10px; transition: border-color .2s; }
  input::placeholder { color: var(--ink-3); }
  input:focus { outline: none; border-color: var(--accent); }
  .btn { display: inline-flex; align-items: center; gap: 7px; font: 500 14px/1 var(--sans); cursor: pointer;
         border-radius: 10px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink);
         padding: 9px 13px; text-decoration: none; transition: background .15s, border-color .15s, transform .15s; }
  .btn:hover { border-color: var(--ink-3); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); padding: 10px 18px; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn:disabled { opacity: .55; cursor: default; transform: none; }
  .lang { position: relative; display: flex; align-items: center; gap: 6px; padding: 0 10px; color: var(--ink-2);
          background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; transition: border-color .15s; }
  .lang:hover, .lang:focus-within { border-color: var(--ink-3); }
  .lang select { appearance: none; border: 0; background: none; color: var(--ink); font: 500 14px/1 var(--sans);
                 padding: 10px 14px 10px 0; cursor: pointer; max-width: 11em; }
  .lang select:focus { outline: none; }
  .lang::after { content: ""; position: absolute; right: 11px; top: 50%; width: 5px; height: 5px; margin-top: -4px;
                 border: solid var(--ink-3); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); pointer-events: none; }
  @media (max-width: 560px) { form { flex-wrap: wrap; } form input { flex-basis: 100%; } .lang { flex: 1; } }

  body.empty .bar { flex-direction: column; justify-content: center; min-height: 88vh; gap: 28px; text-align: center; }
  body.empty .brand { flex-direction: column; gap: 18px; font-size: clamp(2.25rem, 5.5vw, 3.1rem); letter-spacing: -.025em; }
  body.empty .brand img { width: 88px; height: 88px; }
  body.empty .tagline { display: block; }
  body.empty .bar { flex-wrap: nowrap; }
  body.empty form { flex: none; margin: 0; width: 100%; }
  body.empty input { padding: 14px 16px; font-size: 16px; }
  .tagline { display: none; margin: -14px 0 0; color: var(--ink-2); font: italic 1.2rem/1.4 var(--serif); }

  .bar { flex-wrap: wrap; }
  .note { flex-basis: 100%; color: var(--ink-2); font-size: 13.5px; display: flex; align-items: center;
          gap: 8px; min-height: 1.5em; margin: -8px 0 0; }
  .note:empty { display: none; }
  body.empty .note { justify-content: center; margin: 0; }
  .note.error { color: var(--accent); white-space: pre-wrap; }
  .spin { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- document ---------- */
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 96px; display: grid;
          grid-template-columns: 210px minmax(0, 70ch); gap: 64px; justify-content: center; }
  @media (max-width: 1000px) { .wrap { grid-template-columns: minmax(0, 70ch); } .toc { display: none; } }

  .toc { position: sticky; top: calc(var(--bar-h, 0px) + 28px); align-self: start; font-size: 13px; padding-top: 6px;
         max-height: calc(100vh - var(--bar-h, 0px) - 56px); overflow-y: auto; scrollbar-width: thin; }
  .toc a { display: block; text-decoration: none; color: var(--ink-3); padding: 5px 0 5px 12px;
           border-left: 1px solid var(--rule); transition: color .2s, border-color .2s; line-height: 1.35; }
  .toc a.sub { padding-left: 24px; font-size: 12.5px; }
  .toc a:hover { color: var(--ink); }
  .toc a.on { color: var(--ink); border-left-color: var(--accent); }

  .head { display: grid; grid-template-columns: 240px 1fr; gap: 28px; align-items: center;
          padding-bottom: 32px; border-bottom: 1px solid var(--rule); }
  @media (max-width: 640px) { .head { grid-template-columns: 1fr; gap: 20px; } }
  .thumb { display: block; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); position: relative; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s var(--ease); }
  .thumb:hover img { transform: scale(1.03); }
  .thumb span { position: absolute; inset: auto 10px 10px auto; background: rgb(0 0 0 / .72); color: #fff;
                font: 500 12px/1 var(--mono); padding: 5px 7px; border-radius: 6px; font-variant-numeric: tabular-nums; }
  .head h1 { margin: 0 0 10px; font: 500 clamp(1.75rem, 3.4vw, 2.45rem)/1.12 var(--serif); letter-spacing: -.02em; text-wrap: balance; }
  .by { color: var(--ink-2); margin: 0 0 18px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .reveal { animation: reveal .9s var(--ease) both; }
  .reveal .thumb { animation: unveil 1.1s var(--ease) both; }
  @keyframes reveal { from { opacity: 0; transform: translateY(10px); filter: blur(4px); } }
  @keyframes unveil { from { clip-path: inset(0 0 100% 0 round 12px); } to { clip-path: inset(0 0 0 0 round 12px); } }

  /* summary body */
  #summary { font: 400 1.14rem/1.7 var(--serif); }
  #summary p { margin: 0 0 1em; }
  #summary strong { font-weight: 600; }
  #summary section { padding-top: 8px; }
  #summary h2:focus, #summary h3:focus { outline: none; }  /* focus moves here from the outline; the scroll shows where */
  #summary h2 { font: 500 1.6rem/1.2 var(--serif); letter-spacing: -.015em; margin: 52px 0 18px; text-wrap: balance; }
  #summary h3 { font: 600 1.22rem/1.3 var(--serif); margin: 36px 0 10px; display: flex; align-items: baseline; gap: 12px; text-wrap: balance; }
  #summary ul, #summary ol { margin: 0 0 1em; padding-inline-start: 1.2em; }
  #summary li { margin: 0 0 .5em; padding-inline-start: .2em; }
  #summary li::marker { color: var(--ink-3); }
  #summary blockquote { margin: 1.2em 0; padding-inline-start: 1em; border-inline-start: 1px solid var(--rule); color: var(--ink-2); font-style: italic; }
  #summary a:not(.ts) { color: var(--accent); }

  .ts { display: inline-flex; align-items: center; gap: 4px; font: 500 12.5px/1 var(--mono); font-variant-numeric: tabular-nums;
        color: var(--chip-ink); background: var(--chip-bg); padding: 5px 8px 5px 6px; border-radius: 999px;
        text-decoration: none; white-space: nowrap; vertical-align: .12em; transition: background .15s, color .15s; }
  .ts svg { width: 10px; height: 10px; fill: currentColor; stroke: none; }
  .ts:hover { background: var(--accent); color: var(--accent-ink); }

  /* TL;DR: the standfirst */
  #summary [data-kind^="tl"] h2 { margin-top: 36px; }
  #summary [data-kind^="tl"] p { font-size: 1.38rem; line-height: 1.55; color: var(--ink); }

  /* Key points: timestamp column */
  #summary [data-kind^="key"] ul { list-style: none; padding: 0; }
  #summary [data-kind^="key"] li { padding: 12px 0; margin: 0; border-top: 1px solid var(--rule); }
  #summary [data-kind^="key"] li.lead { display: grid; grid-template-columns: 5.2rem 1fr; gap: 12px; }
  #summary [data-kind^="key"] li:last-child { border-bottom: 1px solid var(--rule); }
  #summary [data-kind^="key"] li > .ts { justify-self: start; align-self: start; margin-top: .3em; }

  /* Quotes */
  #summary [data-kind^="notable"] ul { list-style: none; padding: 0; }
  #summary [data-kind^="notable"] li { font: italic 400 1.4rem/1.45 var(--serif); margin: 0 0 28px; padding-inline-start: 1.6rem; position: relative; text-wrap: pretty; }
  #summary [data-kind^="notable"] li::before { content: "\201C"; position: absolute; inset-inline-start: -.1rem; top: -.35rem;
                                               font: 500 3rem/1 var(--serif); color: var(--accent); }
  #summary [data-kind^="notable"] li .ts { display: flex; width: fit-content; margin-top: 10px; font-style: normal; }

  /* Takeaways: closing band */
  #summary [data-kind^="takeaway"] { background: var(--band); border-radius: 16px; padding: 4px 28px 14px; margin-top: 52px; }
  #summary [data-kind^="takeaway"] h2 { margin-top: 24px; }
  #summary [data-kind^="takeaway"] li::marker { color: var(--accent); }

  #summary.writing > section:last-child > :last-child::after {
    content: ""; display: inline-block; width: .5em; height: 1.05em; margin-inline-start: 3px; vertical-align: -.15em;
    background: var(--accent); border-radius: 1px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body class="empty">
<header class="top"><div class="bar">
  <div class="brand"><img src="/favicon.svg" alt=""><span>YouTube <em>Summarizer</em></span></div>
  <p class="tagline">Paste a link. Read the whole video in minutes.</p>
  <form id="form">
    <input id="url" type="url" placeholder="Paste a YouTube link…" aria-label="YouTube link" required autofocus>
    <label class="lang" title="Summary language"><svg class="i"><use href="#i-globe"/></svg>
      <select id="lang" aria-label="Summary language"><option value="en">English</option></select></label>
    <button class="btn primary" id="go">Summarize</button>
  </form>
  <div class="theme" role="radiogroup" aria-label="Theme">
    <button role="radio" data-theme="light" aria-label="Light" title="Light"><svg class="i"><use href="#i-sun"/></svg></button>
    <button role="radio" data-theme="dark" aria-label="Dark" title="Dark"><svg class="i"><use href="#i-moon"/></svg></button>
    <button role="radio" data-theme="system" aria-label="System" title="System"><svg class="i"><use href="#i-system"/></svg></button>
  </div>
  <div class="note" id="note" role="status"></div>
</div></header>

<div class="wrap" id="result" hidden>
  <nav class="toc" id="toc" aria-label="Sections"></nav>
  <article>
    <div class="head reveal">
      <a class="thumb" id="thumb" target="_blank" rel="noopener"><span id="dur"></span></a>
      <div>
        <h1 id="title"></h1>
        <p class="by" id="by"></p>
        <div class="actions">
          <button class="btn" data-act="transcript"><svg class="i"><use href="#i-down"/></svg>Transcript</button>
          <button class="btn" data-act="download" disabled><svg class="i"><use href="#i-down"/></svg>Summary</button>
          <button class="btn" data-act="copy" disabled><svg class="i"><use href="#i-copy"/></svg><span>Copy summary</span></button>
        </div>
      </div>
    </div>
    <div id="summary"></div>
  </article>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5m0 3.2v.1"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m11 12 8-8m-3 3 2.5 2.5M14 9l2 2"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2m0 15v2M4.6 4.6l1.4 1.4m12 12 1.4 1.4M2.5 12h2m15 0h2M4.6 19.4 6 18M18 6l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
  <symbol id="i-system" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M8.5 20h7M12 16.5V20"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></symbol>
  <symbol id="i-spin" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/></symbol>
</svg>

<script>
const $ = id => document.getElementById(id);
const md = { summary: "" };
const TS = /^(?:\d+:)?\d{1,2}:\d{2}$/;
const KINDS = ["tl", "key", "detailed", "notable", "takeaway"];
const clean = text => text.replace(/^\s*<document>\s*/, "").replace(/\s*<\/document>\s*$/, "");
const OPEN_Q = /^\s*["“„«「『‘]/;
const PLAY = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2.5 1.6v6.8L8.4 5z"/></svg>';
const icon = name => `<svg class="i${name === "spin" ? " spin" : ""}"><use href="#i-${name}"/></svg>`;
let video = null, keySource = null, loading = false, inflight = null;
let cache = {};  // lang -> finished summary for the current video

function note(text, kind = "") {
  const n = $("note");
  n.className = "note" + (kind === "error" ? " error" : "");
  n.replaceChildren();
  if (kind) n.insertAdjacentHTML("afterbegin", icon({ error: "alert", busy: "spin", key: "key" }[kind]));
  if (text) n.append(text);
}

async function checkKey() {
  keySource = (await (await fetch("/api/key")).json()).source;
  if (!keySource && !$("note").classList.contains("error"))
    note("No API key yet. Copy your Anthropic key (sk-ant-…) to the clipboard and it's picked up automatically.", "key");
  else if (keySource && $("note").textContent.startsWith("No API key")) note("");
}

const seconds = t => t.split(":").reduce((a, n) => a * 60 + +n, 0);
const linkTimestamps = text => text.replace(/[\[(]((?:\d+:)?\d{1,2}:\d{2})[\])](?!\()/g,
  (m, t) => `[${t}](${video.url}&t=${seconds(t)}s)`);
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

function render() {
  const tmp = document.createElement("div");
  tmp.innerHTML = DOMPurify.sanitize(marked.parse(linkTimestamps(clean(md.summary))));
  tmp.querySelectorAll("a").forEach(a => {
    a.target = "_blank"; a.rel = "noopener";
    if (TS.test(a.textContent.trim())) { a.className = "ts"; a.insertAdjacentHTML("afterbegin", PLAY); a.title = "Play from here"; }
  });
  tmp.querySelectorAll("h3").forEach(h => { const ts = h.querySelector(".ts"); if (ts) h.prepend(ts); });
  tmp.querySelectorAll("li").forEach(li => {
    const first = li.firstElementChild;
    if (!first?.classList.contains("ts")) return;
    const before = li.firstChild === first ? "" : li.firstChild.textContent;
    if (before.trim() || (li.firstChild !== first && li.firstChild.nextSibling !== first)) return;
    const body = document.createElement("span");
    body.append(...[...li.childNodes].filter(n => n !== first));
    li.replaceChildren(first, body);
    li.classList.add("lead");
  });
  const frag = document.createDocumentFragment();
  let sec = null, n = 0;
  for (const node of [...tmp.childNodes]) {
    if (node.nodeName === "H2" || !sec) {
      sec = document.createElement("section");
      sec.dataset.kind = KINDS[n++] ?? "extra";  // text before the first heading is a TL;DR missing its heading
      frag.append(sec);
    }
    sec.append(node);
  }
  // the prompt fixes the order; only "notable quotes" is optional, so tell it apart from takeaways by its content
  const fourth = frag.querySelector('[data-kind="notable"]');
  if (fourth) {
    const items = [...fourth.querySelectorAll("li")];
    const quoted = items.filter(li => OPEN_Q.test(li.textContent)).length;
    if (items.length && quoted < items.length / 2) fourth.dataset.kind = "takeaway";
  }
  frag.querySelectorAll('[data-kind="notable"] li').forEach(li => {  // the design draws its own opening mark
    const texts = [...li.childNodes].filter(n => n.nodeType === 3 && n.textContent.trim());
    if (texts[0]) texts[0].textContent = texts[0].textContent.replace(OPEN_Q, "");
    const last = texts.at(-1);
    if (last) last.textContent = last.textContent.replace(/["”»」』’]\s*$/, "");
  });
  frag.querySelectorAll("h2, h3").forEach((h, i) => { h.id = `s${i}-${slug(h.textContent).slice(0, 40)}`; h.tabIndex = -1; });
  $("summary").replaceChildren(frag);
  buildToc();
}

function buildToc() {
  $("toc").replaceChildren(...[...$("summary").querySelectorAll("h2, h3")].map(h => {
    const label = h.cloneNode(true);
    label.querySelectorAll(".ts").forEach(t => t.remove());
    return Object.assign(document.createElement("a"), {
      href: "#" + h.id, textContent: label.textContent.trim(), className: h.nodeName === "H3" ? "sub" : "",
    });
  }));
}

// Outline highlight follows the last heading above 30% of the viewport. After a click the clicked entry stays
// highlighted until the reader scrolls again, even when the page can't scroll that heading to the top.
let tocLock = 0, pinned = null, pinnedAt = 0, spyQueued = false;
function highlight(id) {
  [...$("toc").children].forEach(a => a.classList.toggle("on", a.hash.slice(1) === id));
}
function spyUpdate() {
  if (Date.now() < tocLock) return;
  if (pinned && Math.abs(scrollY - pinnedAt) < 4) return highlight(pinned);
  pinned = null;
  const heads = $("summary").querySelectorAll("h2, h3");
  if (!heads.length) return;
  let current = heads[0];
  const line = barH() + (innerHeight - barH()) * .3;
  for (const h of heads) { if (h.getBoundingClientRect().top > line) break; current = h; }
  highlight(current.id);
}
addEventListener("scroll", () => {
  if (!spyQueued) { spyQueued = true; requestAnimationFrame(() => { spyQueued = false; spyUpdate(); }); }
}, { passive: true });

$("toc").onclick = e => {
  const a = e.target.closest("a");
  if (!a) return;
  e.preventDefault();
  const target = document.getElementById(a.hash.slice(1));
  if (!target) return;
  highlight(pinned = target.id);
  target.focus({ preventScroll: true });
  const y = Math.min(scrollY + target.getBoundingClientRect().top - barH() - 28,
                     document.documentElement.scrollHeight - innerHeight);
  tocLock = Infinity;  // don't track the headings the jump scrolls past
  glide(Math.max(0, y), () => { tocLock = 0; pinnedAt = scrollY; });
};

// Our own eased scroll: browser smooth-scrolling varies (and some browsers make it a jump).
let glideFrame = 0, glideDone = null;
function glide(y, done) {
  stopGlide();
  const from = scrollY, dist = y - from;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || Math.abs(dist) < 2) { scrollTo(0, y); return done(); }
  const ms = Math.min(1000, 380 + Math.abs(dist) * .12), t0 = performance.now();
  glideDone = done;
  const step = now => {
    const t = Math.min(1, (now - t0) / ms);
    scrollTo(0, from + dist * (1 - Math.pow(1 - t, 4)));  // ease-out quart
    if (t < 1) glideFrame = requestAnimationFrame(step);
    else { glideFrame = 0; const d = glideDone; glideDone = null; d?.(); }
  };
  glideFrame = requestAnimationFrame(step);
}
function stopGlide() {
  if (!glideFrame) return;
  cancelAnimationFrame(glideFrame);
  glideFrame = 0;
  const d = glideDone; glideDone = null; d?.();
}
["wheel", "touchstart", "keydown"].forEach(ev => addEventListener(ev, stopGlide, { passive: true }));  // reader takes over

// height of the pinned top bar (0 on the start screen, where it isn't pinned)
const barH = () => document.body.classList.contains("empty") ? 0 : document.querySelector(".top").offsetHeight;
new ResizeObserver(() => document.documentElement.style.setProperty("--bar-h", barH() + "px"))
  .observe(document.querySelector(".top"));

const watchToc = () => { pinned = null; spyUpdate(); };

async function post(path, body, signal) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), signal });
  if (!r.ok) throw Object.assign(new Error((await r.json().catch(() => ({}))).error || `Request failed (HTTP ${r.status}).`), { status: r.status });
  return r;
}

function setDone(done) {
  document.querySelectorAll('[data-act="download"], [data-act="copy"]').forEach(b => b.disabled = !done);
}

$("form").onsubmit = async e => {
  e.preventDefault();
  inflight?.abort();
  $("go").disabled = loading = true;
  setDone(false);
  try {
    note("Fetching captions…", "busy");
    video = await (await post("/api/transcript", { url: $("url").value.trim() })).json();
    cache = {};
    document.body.classList.remove("empty");
    $("title").textContent = video.title;
    $("by").textContent = `${video.channel} · captions: ${video.captions}`;
    $("dur").textContent = video.duration;
    $("thumb").href = video.url;
    $("thumb").querySelector("img")?.remove();
    if (video.thumbnail) $("thumb").prepend(Object.assign(new Image(), { src: video.thumbnail, alt: "", referrerPolicy: "no-referrer" }));
    $("thumb").hidden = !video.thumbnail;
    document.title = `${video.title} · YouTube Summarizer`;
    const head = document.querySelector(".head");
    head.classList.remove("reveal"); void head.offsetWidth; head.classList.add("reveal");
    $("result").hidden = false;
  } catch (err) {
    note(err.message, "error");
    checkKey();
    return;
  } finally {
    $("go").disabled = loading = false;
  }
  summarize($("lang").value);
};

async function summarize(lang) {
  inflight?.abort();
  const ctl = inflight = new AbortController();
  const name = langName(lang);
  Object.assign($("summary"), { lang, dir: lang === "ar" ? "rtl" : "ltr" });
  setDone(false);
  if (cache[lang]) {
    md.summary = cache[lang];
    render(); watchToc(); setDone(true); note("");
    return;
  }
  md.summary = "";
  $("summary").replaceChildren();
  $("toc").replaceChildren();
  try {
    let r;
    note(`Writing the summary in ${name}… long videos take a minute or two.`, "busy");
    try {
      r = await post("/api/summary", { id: video.id, lang }, ctl.signal);
    } catch (err) {
      // transcript gone (app restarted): translate a summary we already have instead
      const source = err.status === 404 && Object.values(cache)[0];
      if (!source) throw err;
      note(`Translating the existing summary into ${name}…`, "busy");
      r = await post("/api/translate", { markdown: source, lang }, ctl.signal);
    }
    checkKey();
    $("summary").classList.add("writing");
    const reader = r.body.getReader(), dec = new TextDecoder();
    let queued = false;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      md.summary += dec.decode(value, { stream: true });
      if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; if (inflight === ctl) render(); }); }
    }
    $("summary").classList.remove("writing");
    render();
    watchToc();
    const failed = md.summary.includes("**Error:**");
    if (!failed) cache[lang] = md.summary = clean(md.summary);
    note(failed ? "The summary stopped early. See the error at the end." : "", failed ? "error" : "");
    setDone(!failed);
  } catch (err) {
    if (ctl.signal.aborted) return;  // superseded by a newer request
    $("summary").classList.remove("writing");
    note(err.message, "error");
    checkKey();
  }
}

const LABELS = { id: "Bahasa Indonesia", ms: "Bahasa Melayu" };  // Intl names these just "Indonesia" / "Melayu"
const langName = code => { try { return LABELS[code] || new Intl.DisplayNames([code], { type: "language" }).of(code); } catch { return code; } };

async function loadLanguages() {
  const langs = await (await fetch("/api/languages")).json();
  let saved = "en";
  try { saved = localStorage.getItem("lang") || "en"; } catch {}
  $("lang").replaceChildren(...Object.keys(langs).map(code => {
    const name = langName(code);
    return new Option(name.charAt(0).toLocaleUpperCase(code) + name.slice(1), code, false, code === saved);
  }));
}

$("lang").onchange = () => {
  try { localStorage.setItem("lang", $("lang").value); } catch {}
  if (video && !loading) summarize($("lang").value);
};
loadLanguages();

function download(name, text) {
  const a = Object.assign(document.createElement("a"), {
    href: URL.createObjectURL(new Blob([text], { type: "text/markdown" })),
    download: `${video.title.replace(/[^\w\- ]+/g, "").trim() || video.id} - ${name}.md`,
  });
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || !video) return;
  if (b.dataset.act === "transcript") download("transcript", video.markdown);
  if (b.dataset.act === "download") download($("lang").value === "en" ? "summary" : `summary (${$("lang").value})`, video.header + md.summary);
  if (b.dataset.act === "copy") {
    navigator.clipboard.writeText(md.summary);
    b.querySelector("use").setAttribute("href", "#i-check");
    b.querySelector("span").textContent = "Copied";
    setTimeout(() => { b.querySelector("use").setAttribute("href", "#i-copy"); b.querySelector("span").textContent = "Copy summary"; }, 1400);
  }
});

function setTheme(t) {
  if (t === "system") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = t;
  try { localStorage.setItem("theme", t); } catch {}
  document.querySelectorAll(".theme button").forEach(b => b.setAttribute("aria-checked", b.dataset.theme === t));
}
document.querySelectorAll(".theme button").forEach(b => b.onclick = () => setTheme(b.dataset.theme));
setTheme(document.documentElement.dataset.theme || "system");

window.addEventListener("focus", checkKey);
checkKey();
</script>
</body>
</html>
