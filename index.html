<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Summarizer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root {
    --bg: #f6f6f4; --panel: #fff; --text: #1d1d1f; --muted: #6e6e73; --border: #e3e3e0;
    --accent: #d92d20; --accent-text: #fff; --link: #0b62c4; --error: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414; --panel: #1e1e1e; --text: #ececec; --muted: #9a9a9a; --border: #333;
      --accent: #ef4434; --link: #6cb2ff; --error: #ff7a6b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  main { max-width: 1280px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 20px; letter-spacing: -0.01em; }
  h1 span { color: var(--accent); }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; padding: 12px 14px; font: inherit; color: inherit; background: var(--panel);
          border: 1px solid var(--border); border-radius: 10px; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--border);
           background: var(--panel); color: inherit; padding: 6px 12px; }
  button.primary { background: var(--accent); color: var(--accent-text); border: 0; padding: 12px 20px; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .status { margin: 12px 2px; color: var(--muted); min-height: 1.6em; }
  .status.error { color: var(--error); white-space: pre-wrap; }
  .meta { margin: 8px 0 20px; }
  .meta h2 { margin: 0; font-size: 20px; }
  .meta p { margin: 4px 0 0; color: var(--muted); }
  .cols { display: grid; grid-template-columns: 3fr 2fr; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px 24px; min-width: 0; }
  section header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  section header h3 { margin: 0; flex: 1; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  #transcript { max-height: 75vh; overflow-y: auto; }
  #transcript p { margin: 0 0 12px; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .t { font-variant-numeric: tabular-nums; font-weight: 600; margin-right: 6px; }
  #summary h2 { font-size: 18px; margin: 24px 0 8px; }
  #summary h2:first-child { margin-top: 0; }
  #summary h3 { font-size: 16px; margin: 18px 0 6px; }
  #summary blockquote { margin: 8px 0; padding-left: 12px; border-left: 3px solid var(--border); color: var(--muted); }
  .key { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .key.missing { color: var(--error); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1><span>▶</span> YouTube Summarizer</h1>
  <form id="form">
    <input id="url" type="url" placeholder="Paste a YouTube link…" required autofocus>
    <button class="primary" id="go">Summarize</button>
  </form>
  <div class="key" id="key"></div>
  <div class="status" id="status" role="status"></div>

  <div id="result" hidden>
    <div class="meta"><h2 id="title"></h2><p id="sub"></p></div>
    <div class="cols">
      <section>
        <header><h3>Summary</h3>
          <button data-copy="summary">Copy</button><button data-dl="summary">Download</button></header>
        <div id="summary"></div>
      </section>
      <section>
        <header><h3>Transcript</h3>
          <button data-copy="transcript">Copy</button><button data-dl="transcript">Download</button></header>
        <div id="transcript"></div>
      </section>
    </div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const md = { summary: "", transcript: "" };
let video = null;

function status(text, error = false) { $("status").textContent = text; $("status").className = "status" + (error ? " error" : ""); }

async function checkKey() {
  const { source } = await (await fetch("/api/key")).json();
  $("key").className = "key" + (source ? "" : " missing");
  $("key").textContent = source ? "API key: saved in Keychain ✓"
    : "No API key yet: copy your Anthropic key (sk-ant-…) to the clipboard. It will be picked up automatically.";
  return source;
}

const seconds = t => t.split(":").reduce((a, n) => a * 60 + +n, 0);
const linkTimestamps = text => text.replace(/\[((?:\d+:)?\d{1,2}:\d{2})\](?!\()/g,
  (m, t) => `[${t}](${video.url}&t=${seconds(t)}s)`);

function renderSummary() {
  $("summary").innerHTML = DOMPurify.sanitize(marked.parse(linkTimestamps(md.summary)));
  $("summary").querySelectorAll("a").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
}

async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || `HTTP ${r.status}`);
  return r;
}

$("form").onsubmit = async e => {
  e.preventDefault();
  $("go").disabled = true;
  $("result").hidden = true;
  try {
    status("Fetching transcript…");
    video = await (await post("/api/transcript", { url: $("url").value })).json();
    md.transcript = video.markdown;
    $("title").textContent = video.title;
    $("sub").textContent = `${video.channel} · ${video.duration} · captions: ${video.captions}`;
    $("transcript").replaceChildren(...video.paragraphs.map(([s, t, text]) => {
      const p = document.createElement("p"), a = document.createElement("a");
      Object.assign(a, { href: `${video.url}&t=${s}s`, target: "_blank", rel: "noopener", className: "t", textContent: t });
      p.append(a, text);
      return p;
    }));
    md.summary = "";
    $("summary").textContent = "";
    $("result").hidden = false;

    status("Writing summary… (long videos take a minute or two)");
    const r = await post("/api/summary", { id: video.id });
    checkKey();
    const reader = r.body.getReader(), dec = new TextDecoder();
    let pending = false;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      md.summary += dec.decode(value, { stream: true });
      if (!pending) { pending = true; requestAnimationFrame(() => { pending = false; renderSummary(); }); }
    }
    renderSummary();
    status(md.summary.includes("**Error:**") ? "Summary failed, see below." : "Done.");
  } catch (err) {
    status(err.message, true);
    checkKey();
  } finally {
    $("go").disabled = false;
  }
};

document.addEventListener("click", e => {
  const which = e.target.dataset.copy || e.target.dataset.dl;
  if (!which) return;
  if (e.target.dataset.copy) {
    navigator.clipboard.writeText(md[which]);
    e.target.textContent = "Copied"; setTimeout(() => e.target.textContent = "Copy", 1200);
  } else {
    const a = Object.assign(document.createElement("a"), {
      href: URL.createObjectURL(new Blob([which === "summary" ? video.header + md.summary : md[which]], { type: "text/markdown" })),
      download: `${video.title.replace(/[^\w\- ]+/g, "").trim() || video.id} - ${which}.md`,
    });
    a.click(); URL.revokeObjectURL(a.href);
  }
});

window.addEventListener("focus", checkKey);
checkKey();
</script>
</body>
</html>
